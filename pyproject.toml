[project]
name = "supernode-poc"
version = "0.1.0"
description = "Test entropy-weighted PPR retrieval for LLM-built knowledge graphs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.98,<1",
    "datasets>=2.19,<4",
    "matplotlib>=3.8,<4",
    "networkx>=3.2,<4",
    "numpy>=1.26,<3",
    "pydantic>=2.7,<3",
    "pyvis>=0.3.2,<1",
    "requests>=2.31,<3",
    "scipy>=1.12,<2",
    "sentence-transformers>=3.0,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<10",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supernode_poc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
