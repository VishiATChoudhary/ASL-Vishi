[project]
name = "identity-integrity-poc"
version = "0.1.0"
description = "Test soft identity constraints for LLM-written knowledge graphs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=2.19,<4",
    "matplotlib>=3.8,<4",
    "networkx>=3.2,<4",
    "numpy>=1.26,<3",
    "pydantic>=2.7,<3",
    "scipy>=1.12,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<10",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/identity_integrity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
